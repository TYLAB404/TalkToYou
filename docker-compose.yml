version: '3.8'

services:
  talktoyou:
    build: .
    container_name: talktoyou
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - HOST=0.0.0.0
      - PORT=8086
      - ONEBOT_URL=http://napcat:3000
    volumes:
      # 持久化音色库与输出语音条
      - ./voices/customs:/app/voices/customs
      - ./voices/emotions:/app/voices/emotions
      - ./output:/app/output
      # 持久化配置文件与安全加密密钥
      - ./.secret_key:/app/.secret_key
      - ./runninghub_config.json:/app/runninghub_config.json
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: talktoyou_napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=
      - WS_ENABLE=true
      - HTTP_ENABLE=true
      - HTTP_PORT=3000
      - WEBUI_PORT=6099
    ports:
      - "3000:3000"
      - "6099:6099"
    volumes:
      - ./napcat/data:/app/napcat/data
      - ./napcat/config:/app/napcat/config
